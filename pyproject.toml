[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "skillforge"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5"]
[project.optional-dependencies]
integrations = ["nvidia-nat==1.9.0", "mcp==2.2.0"]
[project.entry-points.'nat.components']
skillforge = "backend.nat_plugin"
[tool.setuptools.packages.find]
include = ["backend*"]
